services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: habits
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - habits-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/habits
      DB_USER: habits
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
volumes:
  habits-data:
