name: Java and PostgreSQL verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U habits -d habits"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/habits
      DB_USER: habits
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B -ntp clean verify
